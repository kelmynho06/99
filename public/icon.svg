    stroke-linejoin="round"
  />

  <!-- Inner sweeping northern aurora route curve -->
  <path
    d="M164 260C208 260 242 246 274 226C298 211 312 195 312 178"
    stroke="url(#auroraWaveBright)"
    stroke-width="22"
    stroke-linecap="round"
  />

  <!-- Forward motion chevron & polar star -->
  <path
    d="M214 334H268C294 334 312 321 312 303C312 286 296 274 269 274H208"
