<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="borealBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A2A25" />
      <stop offset="55%" stop-color="#0F2421" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <radialGradient id="auroraGlow" cx="35%" cy="28%" r="70%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#047857" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F2421" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="auroraWavePrimary" x1="120" y1="390" x2="395" y2="120" gradientUnits="userSpaceOnUse">
