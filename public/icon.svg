      <stop offset="45%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
    <linearGradient id="auroraWaveBright" x1="130" y1="130" x2="390" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#borealBg)" />
  <rect width="512" height="512" rx="116" fill="url(#auroraGlow)" />

  <!-- Subtle compass horizon ring -->
  <circle cx="256" cy="256" r="158" stroke="#6EE7B7" stroke-opacity="0.16" stroke-width="4" />

  <!-- Stylized Boreal vertical stem + forward aurora ribbon forming an original "B" crest -->
  <path
    d="M158 378V154C158 139.6 169.6 128 184 128H262C312.8 128 350 156.5 350 198C350 223.8 334.4 244.6 308 254.2C342.4 263.4 364 290.8 364 323C364 366.8 325.6 396 268 396H176C166.1 396 158 387.9 158 378Z"
