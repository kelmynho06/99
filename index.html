<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Go Driver Mobilidade — Corridas e Entregas</title>
    <meta name="description" content="Aplicativo completo de transporte de passageiros e entregas rápidas com rastreamento GPS em tempo real e carteira GoPay." />
    <meta property="og:title" content="Go Driver Mobilidade — Corridas e Entregas" />
    <meta property="og:description" content="Peça corridas de carro, moto ou entrega rápida com segurança por código PIN, carteira GoPay e rastreamento em tempo real." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Go Driver Mobilidade" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Go Driver Mobilidade — Corridas e Entregas" />
    <meta name="twitter:description" content="Peça corridas de carro, moto ou entrega rápida com segurança por código PIN, carteira GoPay e rastreamento em tempo real." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Go Driver Mobilidade",
        "applicationCategory": "TravelApplication",
        "operatingSystem": "All",
        "description": "Aplicativo completo de transporte de passageiros e entregas rápidas com rastreamento GPS em tempo real e carteira GoPay.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "BRL"
        }
      }
    </script>
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Go Driver Mobilidade" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var rawPrefs = localStorage.getItem('velo99_user_prefs_v1');
          if (rawPrefs) {
            var p = JSON.parse(rawPrefs);
            var h = new Date().getHours();
            var isDark = p.theme_mode === 'dark' || (p.theme_mode === 'auto' && (h >= 18 || h < 6));
            if (isDark) document.documentElement.classList.add('dark');
            if (p.language) {
              document.documentElement.lang = p.language;
              document.documentElement.dir = p.language === 'ar' ? 'rtl' : 'ltr';
            }
          }
          var rawBrand = localStorage.getItem('velo99_platform_brand_cache_v1');
          if (rawBrand) {
            var b = JSON.parse(rawBrand);
            if (b.primary_color) {
              document.documentElement.style.setProperty('--brand-primary', b.primary_color);
              document.documentElement.style.setProperty('--godriver-blue', b.primary_color);
            }
            if (b.secondary_color) {
              document.documentElement.style.setProperty('--brand-secondary', b.secondary_color);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F4F6F9] text-[#0F172A] antialiased selection:bg-[#DBEAFE] selection:text-[#0F172A]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
